<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - By Darshil Kashyap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-brand">
            <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="nexusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#818cf8" />
                        <stop offset="100%" stop-color="#6366f1" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#334155" stroke-width="2" />
                <path d="M35 50L50 25L65 50L50 75Z" fill="url(#nexusGlow)" />
                <circle cx="50" cy="50" r="8" fill="#ffffff" />
            </svg>
            <div>
                <h1>Nexus AI</h1>
                <p>Developed by <strong>Darshil Kashyap</strong></p>
            </div>
        </div>
        <div class="header-actions">
            <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
            <button class="clear-btn" onclick="clearHistory()">Clear Chat</button>
        </div>
    </header>

    <div id="chat-window"></div>

    <div id="controls">
        <div class="mode-select">
            <button class="mode-btn active" id="btn-chat" onclick="setMode('chat')">Chat / Code</button>
            <button class="mode-btn" id="btn-image" onclick="setMode('image')">Generate Image</button>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Type a message or prompt..." onkeydown="if(event.key==='Enter') send()">
            <button id="send-btn" onclick="send()">Send</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
